<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Holden Grant Causing</title>
    <meta name="description" content="Page not found. Return to Holden Grant Causing's portfolio homepage.">
    <link rel="icon" href="original-9dcd468fdea0d15ef9354dae872c78d0.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin: 2rem 0 1rem;
            color: var(--text-color);
        }
        .error-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>
    
    <!-- Space Theme Elements -->
    <div class="space-container">
        <!-- Stars -->
        <div class="stars-layer stars-small"></div>
        <div class="stars-layer stars-medium"></div>
        <div class="stars-layer stars-large"></div>
        
        <!-- Moon -->
        <div class="moon">
            <div class="crater crater-1"></div>
            <div class="crater crater-2"></div>
            <div class="crater crater-3"></div>
            <div class="crater crater-4"></div>
        </div>
        
        <!-- Planets -->
        <div class="planet planet-1">
            <div class="planet-ring"></div>
        </div>
        <div class="planet planet-2"></div>
        <div class="planet planet-3"></div>
        
        <!-- Astronaut -->
        <div class="astronaut">
            <div class="astronaut-head">
                <div class="helmet-shine"></div>
            </div>
            <div class="astronaut-body"></div>
            <div class="astronaut-arm-left"></div>
            <div class="astronaut-arm-right"></div>
            <div class="astronaut-leg-left"></div>
            <div class="astronaut-leg-right"></div>
            <div class="astronaut-backpack"></div>
        </div>
        
        <!-- Shooting Stars -->
        <div class="shooting-star shooting-star-1"></div>
        <div class="shooting-star shooting-star-2"></div>
        <div class="shooting-star shooting-star-3"></div>
    </div>
    
    <!-- Dot Pattern Background -->
    <div class="dot-pattern"></div>

    <!-- Error Content -->
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-description">
                Oops! The page you're looking for seems to have drifted into space. 
                Let's get you back on track.
            </p>
            <div class="error-buttons">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="/#contact" class="btn btn-secondary">Contact Me</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
